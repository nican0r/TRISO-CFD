  # reply before it: use the 2x2 momentum setup if c02_apex_mom_v232 reaches
  # fountain reach >= 0.85 and runs less fast in the lower map than
  # c02_point_mom_v232; otherwise the one-cell momentum setup.
  # Pre-registered ~19:40 EDT, before c02_apex_mom_v232 (job 59e19756) ran.
  # Applied by notes/c26_sweep_source_choice.py.
  decided_on: "c02_apex_mom_v232, PIV window 2.4-3.0 s, wall box
               y_center_frac 0.64, same pipeline as c02_point_mom_v232"
  health_gate: "job SUCCEEDED, reached 3.0 s, parcel loss <= 0.5 % of the
                inventory, PIV map finite.  A run that fails it does not
                qualify: the one-cell branch is chosen and the failure
                reported"
  metrics:
    fountain_reach: "as point_3s metrics.fountain_reach (row-max |v| >=
                     0.2 m/s, highest row centre / map height)"
    lower_map_ratio: "mean |v| over the map rows whose centre lies below 0.40
                      of the map height (32 of 79 rows), over the same mean
                      of C26 Fig. 4b (model, 12 slpm, digitized, unsmoothed)"
  reference_c02_point_mom_v232: {fountain_reach: 0.99, lower_map_ratio: 1.297}
  # for scale (same definition): control c02_apex_v232 1.059, experiment
  # 1.060, c02_point_v232 1.192
