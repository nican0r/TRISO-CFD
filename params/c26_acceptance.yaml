point_3s:
  # 3 s runs of the two point-source variants.  User request 2026-10-24:
  # "once the results are downloaded perform an analysis on them.  if it
  # makes sense start 3s runs for the other varied parameters to determine
  # if they resolve the issues with fountain height and wall speed".
  # Pre-registered 2026-10-24 ~23:30 EDT, BEFORE the control c02_apex_v232
  # landed (it was at t = 1.91 s) and before any 3 s point run.
  cases:
    a: c02_point_v232               # the c02_point_v232_smoke05 deck at tstop 3 s
                                    # with the control's output (gas VTK 50 ms,
                                    # PIV frames 2.4-3.0 s)
    b: c02_point_mom_v232           # c02_point_mom_v232_smoke05 likewise
  control: c02_apex_v232
  launch_gate:
    # Decided on the control's result alone.
    H_control: "exit 0, reaches 3.0 s, parcel loss <= 0.5 % of the inventory
                (<= 139 of 27765); otherwise diagnose the 23.2 wall loss first"
    R_already_resolved: "the control meets fountain_resolved AND wall_resolved
                         below -> the variants are not needed; do not launch"
    attribution:
      # breathing = |EP_G_mid closed - open| (notes/c26_spout_cycle.py cycle)
      # of the control over 0.5-3.0 s at its 50 ms frames (~51 phase-random
      # frames).  Calibration, same window and cadence: 26.1.2 c02_momentum24
      # (2 x 2) 0.094 (0.498 / 0.592).  Smokes over 0.10-0.50 s at 5 ms:
      # a 0.046, b 0.042; 26.1.2 2 x 2 apex smoke 0.107.
      launch: "control breathing >= 0.07: 23.2 with the 2 x 2 source breathes
               like 26.1.2, so the smokes' halving is the footprint"
      do_not_launch: "control breathing <= 0.05: the halving is the release; the
                      smokes showed no fountain or wall-layer gain over the
                      2 x 2 source either, so 3 s point runs are not expected
                      to differ from the control"
      in_between: "launch both: no attribution possible, the 3 s runs are the
                   direct test"
  window_s: [2.4, 3.0]              # PIV window, as every C26 3 s score
  metrics:
    fountain_reach: "height of the highest synthetic-PIV map row whose max |v|
                     >= 0.2 m/s, as a fraction of the map height (39.8 mm at
                     12 slpm).  C26 Fig. 4, 12 slpm: exp 0.91, model 0.97.
                     Ours: c02_massonly_axisface 0.45, c02_momentum24 0.44
                     (computed 2026-10-24 when this block was written)"
    wall_speed: "wall_piv_m_s (src/post/piv_c26.py wall box, downward +).
                 C26 Fig. 6d, 12 slpm: model 5.05e-3, exp 1.83e-3
                 (params/piv_c26.yaml wall_targets).  Ours:
                 c02_massonly_axisface 0.0355, c02_momentum24 0.0329
                 (box at y_center_frac 0.5; at 0.64 since 2026-10-25:
                 0.0286 and 0.0289)"
  criteria:
    fountain_resolved: "reach >= 0.85"
    fountain_improved: "reach >= control reach + 0.15"
    wall_resolved: "wall_piv <= 2 x C26 model (<= 1.01e-2 m/s)"
    wall_improved: "wall_piv <= 0.7 x control (a drop of >= 30 %, as grid_layout_ab)"
    wall_no_effect: "|wall_piv change vs control| < 15 %"
  verdict:
    resolves: "fountain_resolved AND wall_resolved"
    improves: "fountain_improved OR wall_improved, and not resolves"
    no_effect: "neither improved"
  also_report: "map mean / C26 model map mean, CC / SSI / MSE against Fig. 4a,
                step-3 D, breathing and d20 over 0.5-3.0 s, spout offset,
                fountain top, parcel inventory"
  gate_result_2026_10_25:
