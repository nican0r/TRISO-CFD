# Case C26 acceptance criteria for the 3 s runs, scored against Conry et al.
# 2026 (C26).  Read by notes/c26_watch_post.py.  SI units: velocities [m/s],
# frequencies [Hz], MSE [m^2/s^2].
#
# Every threshold was written down before the results it scores; the date
# and the notes section are given with each block
# (notes/c26_conry2026_case.md).  Window: the manifest's PIV window, the last
# 0.6 s (t = 2.4-3.0 s for tstop = 3 s; C26 p.5, 3.1).

step3:
  # source: notes "c01 baseline result and step-3 spout checks",
  # pre-registered 2026-10-19.
  A_fountain_min_frame_frac: 0.5   # >= 20 parcels above H_static + 10 mm in
                                   # >= 50 % of PIV frames [-].
                                   # source: C26 p.5 (3.1), fountain in the
                                   # PIV images at every flow.
  B_psd_peak_hz: [10.0, 20.0]      # dP PSD peak [Hz].  source: C26 p.3
                                   # (2.2.2) "approximately 10 spouting events
                                   # every 0.5 s" -> 20 Hz; 10 Hz lower edge
                                   # assumed.
  C1_axis_vp_m_s: [0.26, 1.06]     # peak axis parcel v_y over y = 10/20/30 mm
                                   # [m/s].  source: C26 Fig. 7 (model, 10
                                   # slpm) ~0.53 m/s, x 0.5 to x 2 (assumed).
  C2_outer_over_axis_max: 0.1      # outermost occupied bin |v_y| / axis v_y,
                                   # at every probe height [-].  source: C26
                                   # Fig. 7, ~0 at the walls; 0.1 assumed.
  D_wall_m_s: [0.3e-3, 10.0e-3]    # mean downward parcel v_y within d_cg of
                                   # the wall, y < H_static [m/s].  source:
                                   # C26 Fig. 6d / p.7 (exp 0.933e-3, model
                                   # 3.31e-3 at 10 slpm); band assumed.
  gated_cases: [c01]               # C1 and D bands come from 10 slpm figures:
                                   # they gate c01 only and are a reference
                                   # for c02/c03 (notes, "c01-c03 mass-only
                                   # 3 s results").

piv_map:
  # Synthetic-PIV spout map against the digitized C26 Fig. 4a.
  # Pre-registered 2026-10-21, before any axis-face 3 s result.
  # The map "matches C26's model" when each metric is at least as good as the
  # worse of C26's two model scores: Table 3 (params/sweep_C26.yaml
  # piv_targets_table3) and C26's Fig. 4b scored against 4a through this
  # pipeline (src/post/piv_c26.py).  CC and SSI >= the lower of the two, MSE
  # <= the higher.  source: assumed (C26 gives no acceptance level; Table 3
  # is its own model's score).
  rule: c26_model_floor

grid_layout_ab:
  # Grid-layout A/B (notes "Wall-velocity gap: diagnosis and the grid-layout
  # A/B"), pre-registered 2026-10-20.  Wall D of the axis-face run against
  # the same case on the old layout (<id>_massonly, step-3 D over
  # t = 2.4-3.0 s, notes "c01-c03 mass-only 3 s results").
  baseline_suffix: _massonly
  baseline_D_m_s: {c01: 2.23e-2, c02: 2.92e-2, c03: 3.39e-2}
  substantial_drop_frac: 0.30      # D falls >= 30 % -> substantial [-]
  no_effect_frac: 0.15             # |change| < 15 % -> no effect [-];
                                   # otherwise inconclusive.
  fwhm_probe_y_m: 20.0e-3          # height of the reported spout FWHM [m]
                                   # (same pre-registration).

interp_ab:
  # Interpolation A/B (notes "Interpolation A/B: c02_momentum24_nointerp"),
  # pre-registered 2026-10-23 before the run was submitted.  Hypothesis: the
  # LINEAR_HAT drag/void interpolation (des_interp_on, des_interp_mean_fields;
  # not in C26 Table 1, not MFiX's default) feeds spout gas and lift into the
  # annulus, which fluidizes it and drives the fast wall layer.  Test run:
  # c02 with des_interp_scheme NONE and both flags false, otherwise identical
  # to c02_momentum24 (24-cell box, momentum point source, W = 10, 60 g,
  # 12 slpm).  Baselines are c02_momentum24 over t = 2.4-3.0 s
  # (notes/c26_annulus_metrics.py; step-3 D from c26_compare_momentum24.csv).
  baseline: c02_momentum24
  spout_share_20mm_baseline: 0.60   # gas flux in cells with v_g,y > 2 m/s at
                                    # y = 20 mm over Q [-]
  spout_share_20mm_support: 0.75    # >= this supports the hypothesis
  bed_epg_baseline: 0.56            # bed mean EP_G, y in [2 mm, surface - 3 mm] [-]
  bed_epg_support: 0.50             # <= this supports (packed bed ~0.42-0.45)
  D_baseline_m_s: 2.64e-2           # step-3 D (wall layer, y < H_static) [m/s]
  D_substantial_drop_frac: 0.30     # D falls >= 30 % -> supports (as grid_layout_ab)
  D_no_effect_frac: 0.15            # |change| < 15 % -> no effect
  CC_baseline: 0.825                # synthetic-PIV CC vs C26 Fig. 4a under the
                                    # 'interpolate' convention and the annulus
                                    # bed surface (piv_c26.yaml, both
                                    # 2026-10-23); from the regenerated
                                    # c26_piv_c02_momentum24.csv, still before
                                    # any result of the test run (it was 0.851
                                    # under the all-parcel surface earlier the
                                    # same day; the map bottom moved 4.1 mm
                                    # down, notes "Map bottom moved to the
                                    # annulus surface")
  CC_guard_drop: 0.05               # CC must stay >= baseline - this (guard,
                                    # not a support criterion: filled on
                                    # 2026-10-23 before any result, the
                                    # baseline under the new convention is
                                    # already at C26's own level, 0.85 vs
                                    # 0.87, so CC cannot discriminate; the
                                    # 2026-10-23 draft's "baseline + 0.10"
                                    # was replaced by this guard the same
                                    # day, before submission)
  verdict:                          # supported: D substantial AND >= 1 of
                                    #   spout share / bed EP_G, with the CC
                                    #   guard met; refuted: D no effect AND
                                    #   spout share within 0.05 AND bed EP_G
                                    #   within 0.02 of baseline; else
                                    #   inconclusive.  Health must be GO on
                                    #   inlet/numerics; the dP band (S6) is
                                    #   excluded for momentum-source decks
                                    #   (the P_inlet probe sits in the source
                                    #   cells and reads the momentum-source
                                    #   depression, notes 2026-10-23).
    spout_share_tol: 0.05
    bed_epg_tol: 0.02

  result_2026_10_25:
    aws_job: e7395c56-e6a9-41c2-b434-ffcb8d17886e   # c26-c02-momentum24-nointerp, SUCCEEDED,
                                                    # exit 0, 84872 s wall (23.57 h), MFiX 26.1.2
    window_s: [2.4, 3.0]
    health: "reached 3.0 s; parcel count constant 27778; check_smoke NO-GO only
             on the excluded S6 dP band (0.42 W/A, momentum-source probe)"
    D_wall_m_s: 0.0133               # baseline 0.0264 -> -50 %: substantial
    spout_share_20mm: 0.600          # baseline 0.60 -> no support (needs >= 0.75), within tol
    bed_epg_mean: 0.536              # baseline 0.56 -> no support (needs <= 0.50); |delta|
                                     # 0.024 just outside the 0.02 tol
    bed_void_frac_epg_gt_0p7: 0.162  # baseline 0.20-0.25
    CC: 0.783                        # guard >= 0.775 met by 0.008; below the Table 3 floor
                                     # 0.817 -> map NO MATCH (CC); SSI 0.842, MSE 0.0036
    map_mean_m_s: 0.170              # baseline 0.142 (0.93x C26 model)
    wall_piv_m_s: 0.0169             # baseline 0.0329 (9.2x exp, 3.3x C26 model)
                                     # (wall box y_center_frac 0.5; at 0.64 since
                                     # 2026-10-25: 0.0139 vs 0.0289)
    axis_vp_20mm_m_s: 0.762          # baseline 0.672; FWHM 5.7 vs 7.0 mm
    psd_peak_hz: 15.0                # baseline 11.7
    verdict: "INCONCLUSIVE by the pre-registered rule: D is substantial but
              neither annulus metric supports (spout share and bed EP_G
              unchanged), and D did not fall by the no-effect margin either.
              Reading: dropping LINEAR_HAT halves the wall-layer velocity
              without defluidizing the annulus, and costs CC (0.783); the
              annulus state is not set by the interpolation"

interp_ab_smoke:
  # Early read of the interpolation A/B from a 0.3 s AWS smoke of the same
  # deck (c02_momentum24_nointerp_smoke03: tstop 0.3 s, gas VTK every 5 ms,
  # PIV particle frames 0-0.3 s at 2 ms), pre-registered 2026-10-23 before
  # submission (job ee8632a4-6e12-4b30-98da-11961ce1f44d).  Only the
  # fluidization metrics are scored: in c02_momentum24 the annulus state is
  # set by t = 0.1-0.15 s and never drifts (scratch annulus_vs_time, gas
  # frames every 50 ms: bed EP_G 0.571 over 0.15-0.30 s, 0.549 over
  # 2.4-3.0 s, heave band 0.48-0.62 on every window).  The wall D is NOT
  # scored on the smoke: it is a 0.02-0.03 m/s drift under a +-0.1 m/s heave
  # and two heave cycles give -0.039 vs -0.024 m/s in the baseline.
  run: c02_momentum24_nointerp_smoke03
  window_s: [0.15, 0.30]            # average over this window at 5 ms cadence
  bed_epg_baseline: 0.571           # c02_momentum24, 0.15-0.30 s (4 frames at 50 ms)
  bed_epg_support: 0.50             # <= this on the window mean supports
                                    # (a packed annulus reads 0.42-0.45 at every
                                    # heave phase, outside the 0.48-0.62 band,
                                    # so the cadence difference cannot fake it)
  bed_void_baseline: 0.25           # fraction of bed cells with EP_G > 0.7
  bed_void_support: 0.10            # <= this supports
  spout_share_20mm_baseline: 0.87   # 0.15-0.30 s; already above the 3 s
                                    # support level (0.75), so the spout share
                                    # is reported, not scored, on the smoke
  verdict:                          # supports: bed EP_G AND void fraction at
                                    #   or below their support levels;
                                    # no effect: both within 0.03 / 0.05 of
                                    #   baseline; else inconclusive.  Any
                                    #   verdict here is provisional until the
                                    #   3 s job is scored under interp_ab.

apex_smoke:
  # Closed-apex parametric STL (notes "Closed apex, parametric STL
  # (2026-10-24)"): the cone is extended to its virtual apex at y = -R_t/tan30
  # = -2.062 mm and the mass-only point source moves to the tip row
  # y in [-2.1, 0] mm, whose top opening is the nozzle area (4.45 mm^2), so the
  # tip cells carry the nozzle velocity (44.9 m/s at 12 slpm) by continuity.
  # Pre-registered 2026-10-24 BEFORE the local smoke and before any AWS job.
  # Prediction written down first: on the even 24-cell grid the four-cell
  # column above the tip can carry at most Q / A_open(y = 2.1 mm) = 11-14 m/s,
  # the same as the 2 x 2 momentum source (c02_momentum24: ps_v_g 44.91 m/s,
  # source-row max 14 m/s), because the excess momentum flux turns into
  # pressure in both arrangements.  If that prediction holds, the apex is a
  # null on this grid and the lever is the grid layout (axis-centred cell),
  # not the apex.  The smoke decides; no result is read before the window.
  baseline_run: c02_momentum24_nointerp_smoke03   # 5 ms gas frames; LINEAR_HAT
                                                  # vs NONE was "no effect"
  # Jet criterion J (gate for the AWS smoke): on-axis max v_g,y [m/s], window
  # mean over all 5 ms frames in the window (scratch jet_profile.py: max over
  # cells with r < 1.6 dx in the row).  Baseline over 0.15-0.30 s (30 frames);
  # the same rows over 0.02-0.05 s are used for the local 0.05 s smoke, read
  # from the same baseline run.
  jet_baseline_m_s: {y_1mm: 14.8, y_3mm: 14.0, y_5mm: 12.3, y_10mm: 8.2, y_21mm: 4.4}
  jet_improved_factor: 1.5      # J improved: >= 1.5 x baseline at BOTH 5 and 10 mm
  jet_no_effect_band: 0.20      # J no effect: within +-20 % at 5 and 10 mm
  # Fountain criterion F (AWS smoke only, PIV particle frames at 2 ms):
  fountain_top_baseline_mm: 32.9    # 99th pct parcel y above the annulus
                                    # surface, mean over 0.15-0.30 s
  fountain_top_improved_mm: 38.0    # C26 model ~40 mm at 12 slpm
  exit_vp_baseline_m_s: 0.303       # parcels r < 3 mm at the annulus surface
  exit_vp_improved_m_s: 0.38        # +25 %
  # Annulus criterion A (AWS smoke only, 5 ms gas frames):
  bed_epg_baseline: 0.571
  bed_epg_improved: 0.54            # toward a packed annulus (0.42-0.45)
  # Health H: exit 0, reaches tstop, parcel count constant, no validator FAIL
  # beyond the known momentum-deck artefacts (S3 exit ratio, P4), dP within
  # 0.5-1.5 W/A.
  decision:
    aws_smoke: "run only if the local smoke gives J improved; if J no effect,
                stop and report (prediction confirmed); if in between, run"
    full_3s_run: "H pass AND J improved AND (F improved OR A improved) on the
                  AWS 0.3 s smoke; otherwise report, do not launch"
  result_2026_10_24:
    aws_job: 51bb89b1-6917-4562-8bbf-823cee2ab9cb   # c26-c02-apex-smoke03, 0.3 s, 5249 s wall, exit 0
    window_s: [0.15, 0.30]                          # 30 gas frames
    jet_m_s: {y_1mm: 24.7, y_3mm: 21.8, y_5mm: 18.6, y_10mm: 10.4, y_21mm: 5.7}
    jet_ratio: {y_5mm: 1.51, y_10mm: 1.27}          # J improved needs >= 1.5 at BOTH: NOT MET
    fountain_top_mm: 30.7                           # F: not improved (>= 38)
    exit_vp_m_s: 0.523                              # F: improved (>= 0.38)
    bed_epg: 0.545                                  # A: not improved (<= 0.54), by 0.005
    health: "solver pass (dt held 1e-5 s, NIT 2, 27759 parcels, 0 facets ignored);
             check_smoke S6 dP 4.8 kPa = 10.7 W/A explained by the tip dynamic
             head (P_INLET monitor sits in the 70 m/s tip cells); S3/S4 exit
             layer = known artefacts"
    piv_0p15_0p30: {map_mean_m_s: 0.265, baseline_map_mean_m_s: 0.170, CC: 0.37, SSI: 0.71, MSE_m2_s2: 0.0177}
    spout_offset_mm: 1.2                            # flux centroid (+0.9, +0.9) mm, one quadrant cell,
                                                    # 5-31.5 mm; local smoke of the same deck chose (+x, -z)
    verdict: "gate not met (J at 10 mm 1.27x); full_3s_run NOT launched. The
              particle-velocity measures improved (+56 % PIV map mean, +73 %
              exit v_p) and the jet gain is the same flux concentrated into
              one quadrant cell (4-cell mean unchanged)"
    odd_grid_check: "closed apex on the odd 25-cell box fails at setup (PS
                     volume zero: the single tip cell has no fluid corner node
                     and is blocked); the even layout is the only one that can
                     hold a nozzle-sized tip at dx = 2.1 mm"

apex_3s:
  # Full 3 s closed-apex run, user decision 2026-10-24 ("run the 3s run, but
  # using the new mfix 23.2 environment"): cases/C26_3d/c02_apex_v232, the
  # c02_apex deck re-rendered for MFiX 23.2 (C26's release; the four
  # 26.1.2-only keywords left out, notes "MFiX 23.2 decks and AWS image").
  # Launched although the apex_smoke gate was not met (J at 10 mm 1.27x);
  # the smoke's particle-velocity gains (+56 % map mean, +73 % exit v_p)
  # are the reason.  Two things change at once against c02_momentum24
  # (26.1.2, momentum 2x2 source): the inlet arrangement and the MFiX
  # release; the 23.2 seeding and drag checks (same notes) found no
  # difference in what they measured, so a difference is read as the inlet
  # unless the 23.2 c02 control run says otherwise.
  # Pre-registered BEFORE submission (2026-10-24), scored at 2.4-3.0 s with
  # src/post/piv_c26.py and notes/c26_annulus_metrics.py:
  predictions:
    map_mean_vs_c26_model: [0.9, 1.2]   # synthetic PIV map mean / C26 model map
                                        # mean; c02_momentum24 (26.1.2) gave 0.72
    cc_not_below_momentum24: true       # CC against C26's map >= c02_momentum24's
                                        # (the quadrant column may lower it)
    bed_epg_change_max: 0.02            # annulus unchanged: |bed EP_G - 0.571| <= 0.02
                                        # (the apex is not the annulus lever)
  health: "exit 0, reaches 3.0 s, parcel count constant, dt 1e-5 held;
           P_INLET dP is the tip dynamic head (~4-5 kPa), not a bed dP"
  reading:
    all_three: "inlet arrangement closes the velocity gap; next lever is the
                annulus (void floor, drag, wall contact), geometry settled"
    map_mean_below_0p9: "inlet cleared as the cause; the gap is in drag or
                         particle-wall contact"
    map_mean_above_1p2: "one-cell column over-concentrates the jet on this
                         grid; compare against the 23.2 c02 control"

  result_2026_10_25:
    aws_job: 38c9dc92-1b36-4026-bacc-ec8487156502   # c26-c02-apex-v232, SUCCEEDED, exit 0,
                                                    # 46576 s wall (12.94 h), 4 vCPU, MFiX 23.2
    window_s: [2.4, 3.0]
    health: "reached 3.0 s; dt 1e-5 held (median NIT 2 in every 0.5 s block);
             0 parcels below the orifice plane; S6 dP +4376 Pa = 9.8 W/A is the
             tip dynamic head (excluded as pre-registered); S3/S4 exit layer has
             no cells (closed apex).  Parcel count NOT constant: 27765 -> 27698
             (-67, 0.24 %, ~22/s).  All 14 losses inside the PIV frames happen
             at one cut-cell corner (y 27.3 mm, r 16.5 mm, 0.5 mm inside the
             cone wall, four diagonal azimuths, |v| < 0.1 m/s; x, y, z all on
             cell faces).  Same corner and rate in the 23.2 point-source smokes
             on this STL; the 26.1.2 run on this STL (c02_apex_smoke03) loses
             none -> 23.2 check_cell_movement.f deletes a DEM particle in a
             non-fluid cell (REMOVE_ROGUE_PARTICLES default .T.); 26.1.2 keeps
             particles in SMALL_CELL_AT cut cells, 23.2 has no such guard; no
             warning in run.log; not the inlet; negligible for the metrics"
    piv:                               # src/post/piv_c26.py, 300 pairs; baseline = c02_momentum24
      map_mean_m_s: 0.1776             # baseline 0.1420
      c26_model_map_mean_m_s: 0.1817   # digitized Fig. 4b, 12 slpm (notes: model 0.182)
      c26_exp_map_mean_m_s: 0.1778     # digitized Fig. 4a, 12 slpm
      map_mean_vs_c26_model: 0.978     # prediction [0.9, 1.2]: MET
      map_mean_vs_c26_exp: 0.999
      baseline_map_mean_vs_c26_model: 0.78   # the "0.72" quoted above does not
                                       # reproduce (0.1420 / 0.1817 = 0.78); a
                                       # model mean of 0.197 would give 0.72 and
                                       # then the apex ratio is 0.90, still inside
      CC: 0.914                        # baseline 0.825 -> prediction MET; C26 model
                                       # vs exp through the same pipeline 0.872; Table 3 0.817
      SSI: 0.883                       # 0.848; 0.740; 0.769
      MSE_m2_s2: 0.00152               # 0.00430; 0.00220; 0.0042
      map_vs_c26_model: MATCH          # first c02 run to clear all three floors
      wall_piv_m_s: 0.0198             # baseline 0.0329; exp 0.00183; C26 model 0.00505
                                       # (10.8x exp, 3.9x model; was 18x / 6.5x)
                                       # (wall box y_center_frac 0.5; at 0.64 since
                                       # 2026-10-25: 0.0146 vs 0.0289, 8.0x / 2.9x)
      empty_window_frac: 0.627         # 0.713
    annulus:                           # notes/c26_annulus_metrics.py, 13 gas frames
      bed_epg_mean: 0.561              # baseline 0.56 same window, 0.571 at 0.15-0.30 s
                                       # -> |delta| 0.01 <= 0.02: prediction MET
      bed_void_frac_epg_gt_0p7: 0.235  # baseline 0.20 (score_smoke) / 0.25
      spout_share_10_20_30mm: [0.81, 0.55, 0.38]   # baseline 0.78 / 0.62 / 0.37
    step3_other_session:               # results/c26_compare_apex_v232.csv (c26_watch_post)
      D_wall_m_s: 0.0210               # baseline 0.0264 (-28 %, inconclusive by the grid-A/B rule)
      axis_vp_20mm_m_s: 0.433          # baseline 0.672: the |z| < d_cg line probe misses
                                       # the off-axis quadrant column; the side-view PIV
                                       # map (projection along z) is the primary metric
      psd_peak_hz: 11.7                # baseline 11.7
    gas_jet_2p4_3p0:                   # scratch jet_profile.py; per-cell max v_g,y
      vgy_max_5mm_m_s: [18.5, 11.0]    # [apex, baseline] -> 1.68x
      vgy_max_10mm_m_s: [11.1, 8.0]    # 1.39x; 4-axis-cell mean unchanged (4.4 vs 4.3; 3.3 vs 3.7)
    fountain_top_mm: [17.6, 15.0]      # 99th pct parcel y above the annulus surface
    exit_vp_m_s: [0.55, 0.53]          # the smoke's +73 % was a startup contrast: the
                                       # baseline reads 0.30 at 0.15-0.30 s and 0.53 at 2.4-3.0 s
    verdict: "all three predictions MET -> reading all_three.  The inlet
              arrangement closes the PIV-map velocity gap: map mean 0.98x C26's
              model and 1.00x the experiment, CC / SSI / MSE better than C26's
              own model scores against the experiment.  The wall layer is still
              3.9x C26's model (down 40 %) and the annulus is unchanged (EP_G
              0.56, 23 % bubble cells), so the next lever is the annulus.  The
              confound stands (23.2 and the inlet changed together); the 23.2
              c02 2x2 control remains the discriminating run"

ps_point_smoke:
  # One-cell point source (notes "Why our model does not match C26's model:
  # the point-source footprint (2026-10-24)").  C26 p.4 places "a point
  # source centered with the reactor"; in MFiX 23.2 a point region maps to
  # ONE cell (get_ps.f / calc_cell.f; dry run ps_point_dry put it in the -x/-z
  # tip cell, 4.865e-10 m3), while our decks use the 2 x 2 axis cells.  On
  # our runs the annulus state follows the jet in the lower cone: the only
  # packed, non-breathing annulus is the 27-cell single-cell momentum run
  # (c01: axis v_g 22 / 19 m/s at 9.4 / 11.5 mm, mid-annulus EP_G 0.435 /
  # 0.443 closed / open, 18.3 Hz); every 2 x 2 source heaves at ~10-12 Hz.
  # Hypothesis: the one-cell source keeps the spout base clear and gives
  # C26's state (packed annulus, ~20 Hz events).
  # Pre-registered 2026-10-24 BEFORE rendering the decks or any run.
  cases:
    a: c02_point_v232_smoke05       # run_C26_3d --case c02 --axis-on-face
                                    # --stl-builder parametric_apex --ps-point
                                    # --ps-mass-only --tstop 0.5
                                    # --vtk-dt-background 0.005
    b: c02_point_mom_v232_smoke05   # the same with --ps-momentum
                                    # (ps_v_g = U_nozzle = 44.9 m/s)
  control: c02_apex_v232            # 23.2, same apex STL, 2 x 2 tip source,
                                    # mass-only; 3 s, running.  One variable
                                    # (footprint) for a; footprint + momentum
                                    # for b.
  window_s: [0.10, 0.50]            # 80 gas frames at 5 ms, ~4-5 cycles
  # Metrics: notes/c26_spout_cycle.py (cycle, jet, lattice).  Baselines =
  # the 2 x 2 apex smoke c02_apex_smoke03 (26.1.2) over 0.10-0.30 s, the
  # only 5 ms 2 x 2 apex record; the control's 3 s 50 ms frames are scored
  # too when it lands (no frequency from 50 ms frames).
  baseline_2x2_apex:
    jet_axis_vmax_m_s: {y_9p4mm: 13.1, y_11p5mm: 11.2}
    epg_mid_closed_open: [0.478, 0.585]   # breathing 0.107
    d20: 0.33
    s_mid_freq_hz: 10.0                   # resolution 5 Hz
  reference_c01_27cell_single_cell_momentum:
