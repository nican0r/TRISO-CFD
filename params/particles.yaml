# Particle properties used in Day 1 terminal-velocity sweep.
# Diameters swept 200-1200 um at three characteristic densities.
# source: PLAN.md sections 1.3 and implementation-steps/day-1.md

d_p_sweep_um:
  # source: implementation-steps/day-1.md (200-1200 um sweep)
  start: 200
  stop: 1200
  step: 50

densities_kg_per_m3:
  # source: implementation-steps/day-1.md {2500, 6000, 10800}
  # 2500  : light surrogate ballast, PLAN 1.3
  # 6000  : rough-order ZrO2 surrogate (Day 1 historical; Case V/D now 6050)
  # 10800 : UO2 real kernel, PLAN 1.3
  - 2500
  - 6000
  - 10800

# Case D (design case) particles: ZrO2 TRISO surrogate.
# source: S2 (Zhou et al. 2005, UTK mockup) — "spherical ZrO2 with a tight
#         size distribution"; 500 um diameter and 6050 kg/m^3.
case_D:
  d_p_m: 500.0e-6           # 500 um
                            # source: S2 (UTK mockup, 500 um principal size)
  rho_p_kg_per_m3: 6050     # source: S2 (ZrO2 particle density 6050 kg/m^3).
                            # Supersedes PLAN.md 1.3's rough 6000 kg/m^3.
  ep_star: 0.42             # TFM min-gas-fraction (= 1 - eps_s,max) [-]
                            # Set to S1 Table 1 "void fraction at minimum
                            # fluidization", which S1 uses as the TFM packing
                            # threshold for its UTK/ORNL closures.
                            # Threshold 1 - ep_star = 0.58 is above the IC
                            # bed value eps_s_bed = 0.57 (Case V), so
                            # Schaeffer frictional stress is inactive at t=0.
                            # source: S1 Table 1 (ORNL/TM-2006/520).

# Case V: ORNL/UTK cold-mockup validation particles.
# Spherical ZrO2 (same particles as Case D). Includes inventory, inertial
# friction angle, and particle-particle restitution coefficient needed by
# the MFiX TFM closures.
# source: S1 (ORNL/TM-2006/520, Table 1) + S2 (Zhou et al. 2005).
case_V:
  d_p_m: 500.0e-6           # 500 um principal particle size.
                            # S2 also tested 300, 400 and 650 um; use 500 um
                            # here because it is the size tabulated against
                            # S1's UTK and ORNL coater validation data.
                            # source: S2 (UTK mockup, body text).
  rho_p_kg_per_m3: 6050     # ZrO2 particle density [kg/m^3]
                            # source: S2 (Zhou et al. 2005, UTK mockup).
  inventory_g: 54.5         # bed inventory [g]
                            # S1's UTK and ORNL validation runs use 54.5 g.
                            # S2 uses 53.9 g in many figures; the two are
                            # within experimental error. 54.5 g chosen so
                            # the case matches S1's validation data (S1
                            # Figures 1 and 2).
                            # source: S1 (ORNL/TM-2006/520, UTK and ORNL
                            #         validation inventory); noted vs S2's
                            #         53.9 g in notes/day8_summary.md.
  friction_angle_deg: 15    # internal (inertial) friction angle [deg]
                            # Fed to MFiX `phi` keyword (Schaeffer closure).
                            # S1 Table 1 says "15 deg; varies with
                            # particles".
                            # source: S1 Table 1.
  ep_star: 0.42             # TFM min-gas-fraction (= 1 - eps_s,max) [-]
                            # Set to S1's "void fraction at minimum
                            # fluidization" from Table 1. See case_D.ep_star
                            # above for the inactivity-at-IC argument.
                            # source: S1 Table 1.
  eps_s_bed: 0.57           # IC bed solids volume fraction at t = 0 [-]
                            # Must sit below 1 - ep_star = 0.58 so the
                            # Schaeffer frictional-stress term is inactive
                            # at t = 0 (physics, not numerical tuning).
                            # 0.57 is one point below eps_s,mf = 0.58
                            # (slightly looser than mf), which is the
                            # standard "resting bed" IC in TFM spouted-bed
                            # studies (San Jose et al. 2005; Du et al.
                            # 2006). H_static derived from inventory,
                            # rho_p and this value in src/make_case.py.
                            # source: assumed (one unit below 1 - ep_star
                            #         so Schaeffer is inactive at t=0;
                            #         justified in notes/day8_summary.md).
  c_e: 0.9                  # particle-particle restitution coefficient [-]
                            # Not reported in S1 or S2 (open item).
                            # 0.9 is the standard default for ZrO2 smooth
                            # spheres and is listed as an open item for
                            # the Day 13 sensitivity study.
                            # source: assumed (not reported in S1/S2;
                            #         likely in S3/S4).

# UO2 real-kernel sensitivity variant, same diameter, higher density.
# source: PLAN.md 1.3 ("Real UO2 kernels are ~10 800 kg/m^3")
case_D_uo2:
  d_p_m: 500.0e-6           # source: assumed (matches surrogate d_p for Geldart comparison)
  rho_p_kg_per_m3: 10800    # source: PLAN.md 1.3
  ep_star: 0.42             # same packing threshold as case_D/case_V
                            # (same particle geometry; density only changes
                            # bed weight, not RCP). source: see case_D.

# Static bed-height sweep for Day 2 U_mf / U_ms figure.
# source: implementation-steps/day-2.md (0.05-0.20 m)
H_sweep_m:
  start: 0.05
  stop:  0.20
  step:  0.01

# Day 4 model-choice particle-count estimate inputs.
# source: implementation-steps/day-4.md ("estimate the particle count from the
# bed volume and eps_s ~ 0.6 for H = 0.10 m" and "pseudo-2D slab thickness ~ 5 d_p").
day4_count_estimate:
  H_static_m: 0.10              # static bed height for the count estimate [m]
                                # source: implementation-steps/day-4.md
  eps_s: 0.6                     # bed solids volume fraction [-]
                                 # source: implementation-steps/day-4.md
  slab_thickness_particles: 5    # pseudo-2D slab thickness in particle diameters [-]
                                 # source: implementation-steps/day-4.md

# Day 6-7: flat-bottom 2D bubbling-bed sweep with Case D particles in air at 20 C.
# See implementation-steps/day-6-7.md.
fb_sweep:
  H_static_m: 0.10        # static (packed) bed height in the 2D rig [m]
                          # source: implementation-steps/day-4.md convention
  eps_s_bed: 0.55         # solids fraction in the packed region at t=0 [-]
                          # source: assumed; sits below the ep_star=0.42
                          # Schaeffer threshold (1 - 0.42 = 0.58 > 0.55).
                          # Day 6-7 base-mesh runs were generated with this
                          # value; do not change it without re-running the
                          # sweep (DeltaP targets depend on it).
  gas_case: air_20C       # key in params/gases.yaml for the fluidizing gas
                          # source: implementation-steps/day-6-7.md
  u_over_umf:             # sweep ratios U / U_mf,calc [-]
                          # source: implementation-steps/day-6-7.md
    - 0.3
    - 0.5
    - 0.7
    - 0.9
    - 1.1
    - 1.3
    - 1.6
    - 2.0
  t_startup_s: 5.0        # discard this initial window before averaging [s]
                          # source: assumed; typical TFM startup transient
  t_avg_s: 3.0            # minimum time-averaging window after startup [s]
                          # source: implementation-steps/day-6-7.md
  dt_init_s: 1.0e-3       # initial MFiX time step [s]
                          # source: Day-5 tutorial precedent
