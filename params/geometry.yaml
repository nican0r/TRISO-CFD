# ORNL/UTK cold-mockup spouted-bed geometry.
# All values SI (metres, degrees). Used by Day 2 U_ms hand-calculations and
# (from Day 3 onward) by the MFiX case builders.
#
# source: S1 (ORNL/TM-2006/520, "standard 50-mm 60-degree cone") and S2
#         (Zhou et al. 2005, UTK mockup). The ORNL coater's own inlet
#         diameter is not confirmed to be 4 mm in S1, so the ORNL 2-inch
#         coater case (if ever added) will need its own geometry block.

bed_V:
  D_c_m: 0.050         # column (cylindrical section) inside diameter [m]
                       # source: S1 ("standard 50-mm cone"); S2 (UTK mockup).
  D_i_m: 0.004         # inlet-orifice diameter [m]  (4 mm, constant diameter)
                       # S2 body text says 0.004 m. S2's abstract says
                       # "0.04 cm" (= 0.4 mm) which is treated as a typo
                       # (contradicts S2's own body text). INL/CON-07-12569
                       # independently confirms a 4 mm constant-diameter
                       # inlet on an INL coater.
                       # source: S2 body text; INL/CON-07-12569 (supporting).
                       # Discrepancy recorded in notes/day8_summary.md.
  cone_angle_deg: 60   # included cone angle at base [deg]
                       # => half-angle 30 deg from the vertical axis.
                       # source: S1 ("standard 50-mm 60-degree cone"); S2
                       #         (UTK mockup tested 45, 60, and 75 deg;
                       #         we use 60 deg to match S1).

# Day 6-7: flat-bottom 2D bubbling-bed test rig for the U_mf sweep.
# No spout: uniform MI across the entire bottom edge. See
# implementation-steps/day-6-7.md. Width retargeted to match the ORNL/UTK
# column (0.05 m) now that Case V has been retargeted. Day-6-7 historical
# base-mesh runs were generated on the pre-retargeted column.
fb_sweep_2d:
  width_m: 0.050       # domain width [m]  (match bed_V D_c)
                       # source: params/geometry.yaml bed_V D_c_m
  height_m: 0.30       # domain height [m] (3x H_static, room for bed expansion)
                       # source: assumed; freeboard ~2x bed height
  imax_base: 38        # base-mesh cells across width [-]  -> dx = ~1.3 mm (~ 2.6 d_p)
                       # source: assumed; see notes/day6-7_summary.md
  jmax_base: 150       # base-mesh cells up height [-]
                       # source: assumed; isotropic cells on base mesh

# Day 8: Case V spouted-bed template (ORNL/UTK cold mockup).
# Planar quadric cut-cell slab (option (b) in implementation-steps/day-8.md).
# MFiX 26.1.2 forbids `cartesian_grid=.True.` with `coordinates='CYLINDRICAL'`,
# so option (a) (axisymmetric with stair-stepped cone) cannot carry a
# resolved sloped cone wall under documented keywords; option (b) is used
# and results are to be treated as qualitative only (see day-8.md).
#
# The axial domain is truncated to ~3 x bed height plus fountain headroom,
# not the full S1/S2 column. The ORNL/UTK column height is not needed for
# the smoke test; a tall freeboard is budgeted but the full column is not.
spouted_bed_V_2d:
  H_dom_m: 0.20              # axial domain extent [m]
                             # ~3 x H_static (0.032 m) + ~0.10 m fountain
                             # headroom. 500 um ZrO2 fountains in this
                             # coater are typically ~2-3 x bed height, so
                             # H_dom = 0.20 m covers the fountain.
                             # source: implementation-steps/day-8.md
                             # (3 x bed + fountain headroom)
  cone_half_angle_deg: 30.0  # Y_CONE half_angle(1) [deg]; 60 deg included cone.
                             # source: S1 ("60 deg cone"); S2 (UTK mockup).
  imax: 50                   # x cell count across full width [-]
                             # dx = 2*R_c/imax = 0.050/50 = 1.000 mm
                             # orifice |x|<=R_i spans 2*R_i/dx = 4.0 cells
                             # (= Day-8 acceptance floor "orifice >= 4 cells").
                             # Cell size 1.0 mm = 2 d_p is well under the
                             # 10 d_p = 5 mm max-cell rule from S1 Table 1.
                             # source: implementation-steps/day-8.md
                             # (planar: cell size <= 1 mm, orifice >= 4 cells).
  jmax: 200                  # axial cell count [-]
                             # dy = H_dom/jmax = 0.20/200 = 1.000 mm (= dx).
                             # source: isotropic-cell convention.
  kmax: 1                    # z cell count [-]  (true 2D with no_k=.True.)
                             # Quadrics work in no_k mode; STL does not
                             # (get_stl_data.f:813). V_2d uses a native
                             # Y_CONE quadric so kmax=1 is valid.
                             # source: MFiX 26.1.2 (quadric + no_k support).
  z_thickness_m: 0.001       # single-cell slab thickness [m] = dx so dz = dx.
                             # z_min = -z_thickness/2, z_max = +z_thickness/2,
                             # zlength = z_thickness. source: assumed (cosmetic).

# Day 10 R1 (NETL-clone redesign, 2026-10-08): Case V 3D spouted-bed template.
# UNIFORM 2 mm Cartesian mesh.  Replaces the Day-10 graded mesh (1 mm near-axis,
# 4.6 mm outer) that triggered MFiX 26.1.2's F_AT cut-cell classifier bug on a
# dense STL — the near-axis fine cells got mis-classified as BLOCKED, producing
# a phantom 2 mm "solid rod" up the vessel axis and preventing the 30 m/s inlet
# jet from forming a spout.  See notes/day10_summary.md "R1 — NETL-clone
# redesign" for the full diagnosis.
#
# Design matches NETL's shipped tutorials/pic/spouted_bed_3d pattern:
#  - uniform Cartesian mesh (no grading);
#  - implicit-SDF STL with ~20 k facets (sampled at 0.5 x cell size);
#  - stub cylinder (radius R_i) extends from y = -L_stub to y = 0 and acts as
#    the physical orifice-equivalent that the STL cuts the MI through;
#  - MI applied across the FULL box bottom face — the STL (not the BC bounds)
#    restricts gas entry to the stub-cylinder footprint;
#  - no cad_propagate_order / set_corner_cells (NETL does not set them).
#
# Box in x,z: ±(R_c + 5 mm margin) = ±30 mm — 2*30/dx = 30 cells each axis.
# Box in y: [-L_stub, H_dom] = [-20 mm, 200 mm] — 220/dy = 110 cells.
# Total 30 * 110 * 30 = 99 000 cells (~7x Day-10 initial graded mesh).
#
# source: implementation-steps/day-10.md; NETL tutorials/pic/spouted_bed_3d.
spouted_bed_V_3d:
  H_dom_m: 0.20              # axial domain extent above the orifice [m]
                              # ~3x H_static (0.032 m) + fountain headroom.
                              # source: implementation-steps/day-10.md
  theta_segments: 60         # angular facets (retained for API symmetry with
                              # the legacy surface-of-revolution writer; the
                              # Day-10 R1 driver uses build_spouted_bed_stl_
                              # implicit which ignores it)
                              # source: assumed (unused in R1)
  dx_uniform_m: 2.0e-3        # uniform Cartesian cell size (dx = dy = dz) [m]
                              # 2 mm; matches NETL's tutorial cell size for a
                              # 5 cm vessel.  2 cells span the 4 mm orifice —
                              # fewer than the Day-10 "4 cells" ambition, but
                              # mirrors NETL's shipped tutorial trade-off (NETL
                              # spans ~4 cells across a 15 mm spout, i.e. a 2x
                              # cell-to-radius ratio; we accept the same).
                              # source: implementation-steps/day-10.md R1
  dx_sample_m: 1.0e-3         # SDF sampling grid for marching cubes [m]
                              # 1 mm = 0.5 x dx_uniform.  Rule of thumb:
                              # dx_sample <= 0.5 x solver cell size so every
                              # solver-cell edge intersects at least one STL
                              # facet.  Expected facet count ~20-50 k (NETL
                              # ships 22 028 at a similar sampling density).
                              # source: assumed; mirrors NETL tutorial density.
  L_stub_m: 2.0e-2            # inlet stub-cylinder length [m] (20 mm = 10 x R_i)
                              # Long enough to let the inlet profile develop
                              # (10x stub radius) but short enough to keep the
                              # cell count down.  The stub cylinder (radius R_i)
                              # extends from y = -L_stub to y = 0 and IS the
                              # physical orifice; the MI is applied across the
                              # entire box bottom face and the STL carves it
                              # down to the stub circle.
                              # source: implementation-steps/day-10.md R1

# Day 10 PIC closure block for Case V (used when solids_model='PIC').
# Values sourced from NETL's tutorials/pic/spouted_bed_3d/spouted_bed_pic_3d.mfx
# (installed under /Users/nelsonpereira/mamba/envs/mfix-26.1.2/share/mfix/
# templates/tutorials/pic/spouted_bed_3d/).  The tutorial is MFiX's canonical
# PIC 3D-spouted-bed template and uses defaults that are known to run
# stably with a 60-deg cone + 4 mm orifice and SYAM_OBRIEN gas drag.
#
# All keywords here are verified against the installed MFiX 26.1.2 keyword
# reference under share/mfix/doc/html/reference/particle_in_cell.html,
# discrete_element.html, initial_condition.html and boundary_condition.html.
spouted_bed_V_3d_pic:
  # --- PIC frictional-stress closure (Harris-Crighton continuum) ---
  fric_exp_pic: 3.0            # Volume-fraction exponential scale factor
                               # in frictional-stress model [-]
                               # keyword: FRIC_EXP_PIC
                               # source: NETL pic/spouted_bed_3d tutorial
  fric_non_sing_fac: 1.0e-7    # Non-singularity term in frictional-stress
                               # model [-]
                               # keyword: FRIC_NON_SING_FAC
                               # source: NETL pic/spouted_bed_3d tutorial
  psfac_fric_pic: 100.0        # Pressure linear scale factor in frictional
                               # stress model [Pa]
                               # keyword: PSFAC_FRIC_PIC
                               # source: NETL pic/spouted_bed_3d tutorial
  # --- Parcel-collision damping / restitution ---
  mppic_coeff_en1: 0.85        # Empirical damping factor for frictional
                               # stress model (parcel-parcel) [-]
                               # keyword: MPPIC_COEFF_EN1
                               # source: NETL pic/spouted_bed_3d tutorial
  mppic_coeff_en_wall: 0.85    # Normal restitution for parcel-wall
                               # collisions [-]
                               # keyword: MPPIC_COEFF_EN_WALL
                               # source: NETL pic/spouted_bed_3d tutorial
  mppic_coeff_et_wall: 1.0     # Tangential restitution for parcel-wall
                               # collisions [-]
                               # keyword: MPPIC_COEFF_ET_WALL
                               # source: NETL pic/spouted_bed_3d tutorial
  mppic_velfac_coeff: 1.0      # Solids slip-velocity scale factor [-]
                               # keyword: MPPIC_VELFAC_COEFF
                               # source: NETL pic/spouted_bed_3d tutorial
  # --- Gas->parcel interpolation (shared with DEM) ---
  des_interp_scheme: 'LINEAR_HAT'
                               # Interpolation scheme used by
                               # DES_INTERP_ON/DES_INTERP_MEAN_FIELDS.
                               # keyword: DES_INTERP_SCHEME
                               # source: NETL pic/spouted_bed_3d tutorial
  des_epg_clip: 0.42           # Minimum gas volume fraction used to clip
                               # drag.  Equal to Case V's ep_star
                               # (= min-fluidization void fraction);
                               # NETL ships 0.42 as the PIC tutorial
                               # default.  Note the NETL tutorial also
                               # uses des_epg_clip = 0.42 which happens
                               # to match ep_star identically; this is a
                               # physics coincidence, not a yaml typo.
                               # keyword: DES_EPG_CLIP
                               # source: NETL pic/spouted_bed_3d tutorial
                               # (ties ep_star to the drag/stress clip).
  friction_model: 'SCHAEFFER'  # Frictional-stress model name.  Shared with
                               # TFM but applied through the PIC solids
                               # stress for PIC runs.
                               # keyword: FRICTION_MODEL
                               # source: NETL pic/spouted_bed_3d tutorial
  # --- Parcel statistical weights ---
  ic_pic_const_statwt: 4.2     # Constant stat-weight for the IC regions
                               # that seed parcels (bed IC2).  Larger value
                               # => fewer physical parcels per cell; smaller
                               # => more parcels and higher wall-time.
                               # For Case V inventory (54.5 g, 500 um ZrO2,
                               # rho_p=6050 kg/m^3), N_phys = m / (rho * V_p)
                               # = 0.0545 / (6050 * (pi/6)(5e-4)^3)
                               # = 1.376e5 real particles; with statwt=4.2,
                               # parcel count ~ 32,800 (observed post-Fix-A:
                               # 32,006 parcels, 2% below theoretical due to
                               # IC region clipping at cone-box corners).
                               # keyword: IC_PIC_CONST_STATWT(IC, PHASE)
                               # source: NETL pic/spouted_bed_3d tutorial
                               #         (statwt value; parcel-count target
                               #          scales with inventory per Case V).
  bc_pic_mi_const_statwt: 5.0  # Stat-weight for BC MI (sentinel value;
                               # bc_ep_s(3,1)=0.0 so no parcels actually
                               # enter via the gas inlet, but the parser
                               # requires this field to be set).
                               # keyword: BC_PIC_MI_CONST_STATWT(BC, PHASE)
                               # source: NETL pic/spouted_bed_3d tutorial

# -----------------------------------------------------------------------
# Operating-point reference values for Case V spouted bed.
# U_ms (minimum spouting velocity) is a critical regime parameter; the
# source must be documented per CLAUDE.md rule 2 (no magic numbers).
#
# The "1.9×U_ms" claim in run_log.csv (Day-8 notes) and PLAN.md §1.1
# derives from S2's direct experimental measurement of U_ms = 12 L/min
# for 500 µm ZrO₂ in the UTK cold-mockup (D_c=50 mm, D_i=4 mm, 60° cone,
# air at ~25 °C). It is NOT derived from Mathur-Gishler or any other
# purely analytical formula.
#
# Correlation cross-checks (all at air 25 °C, rho_g=1.179 kg/m^3,
# mu_g=1.854e-5 Pa.s, Ar=25433):
#
#  (a) Mathur-Gishler (1955) — cylindrical spouted beds:
#        U_ms = (d_p/D_c) * (D_i/D_c)^(1/3) * sqrt(2*g*H*(rho_p-rho_g)/rho_g)
#        At H_static = 32.2 mm  →  U_ms = 0.245 m/s  →  U/U_ms = 0.78
#        BELOW spouting threshold.  M-G is derived for cylindrical beds
#        and systematically over-predicts U_ms in conical geometries with
#        small H/D_c (< 1); the 0.78 result does NOT mean the bed cannot
#        spout — it means M-G is the wrong formula here.
#        Reference: Mathur & Gishler (1955), AIChE J. 1(2):157–164;
#                   Mathur & Epstein, "Spouted Beds" (1974), Eq. 2.1.
#
#  (b) Olazar et al. (1992) — conical spouted beds:
#        U_ms = 0.126 * Ar^0.39 * (D_i/D_c)^1.68 * tan(γ/2)^0.38
#        (γ = 60° included angle; D_b = D_i = cone-base ≡ orifice diameter)
#        At Ar=25433, D_i/D_c=0.08, tan(30°)=0.5774  →  U_ms = 0.077 m/s
#        U/U_ms = 2.50  (H-independent form, Eq. 2 of the 1992 paper).
#        Olazar's accuracy band is ±30%; 0.077 m/s is 24% below S2's
#        measured 0.102 m/s — within the correlation uncertainty.
#        Reference: Olazar, M.; San José, M.J.; Aguayo, A.T.; Arandes, J.M.;
#                   Bilbao, J. (1992) "Stable operation conditions for
#                   gas-solid contact regimes in conical spouted beds,"
#                   Ind. Eng. Chem. Res. 31(7):1784–1791.
#                   DOI 10.1021/ie00007a024.
#
# Conclusion: Olazar (1992) is the theoretically appropriate correlation
# class for a conical spouted bed (confirms U > U_ms, consistent with
# observed spouting). S2's direct measurement is the primary numerical
# anchor for the 1.9× operating-point ratio.
# -----------------------------------------------------------------------
operating_point_V:
  U_in_m_s: 30.0              # Inlet (orifice) gas velocity [m/s]
                               # MFiX BC: bc_v_g at the 4 mm orifice MI.
                               # source: S2 (Zhou et al. 2005, UTK mockup,
                               #         22.6 L/min at 500 µm — upper end of
                               #         S2's stable-spouting range).

  U_sup_m_s: 0.1920            # Superficial velocity in the cylindrical
                               # column at U_in = 30 m/s [m/s]:
                               #   Q = U_in * (pi/4 * D_i^2)
                               #     = 30 * pi/4 * (0.004)^2
                               #     = 3.770e-4 m^3/s  = 22.62 L/min
                               #   U_sup = Q / (pi/4 * D_c^2)
                               #         = 3.770e-4 / 1.963e-3
                               #         = 0.1920 m/s
                               # source: geometric; see src/make_case.py
                               #         build_V_2d_params / build_V_3d_params.

  U_ms_m_s: 0.1019             # Minimum spouting velocity [m/s] (superficial
                               # in 50 mm column).
                               # PRIMARY SOURCE: S2 (Zhou, Bruns, Finney, Daw
                               # et al., UTK cold-mockup, AIChE Annual Meeting
                               # 2005), which reports U_ms = 12 L/min for
                               # 500 µm ZrO₂ in the UTK rig (D_c=50 mm,
                               # D_i=4 mm, 60° cone, air ~25 °C):
                               #   U_ms = (12 L/min) / (1000*60) / A_column
                               #        = 2.000e-4 m^3/s / 1.963e-3 m^2
                               #        = 0.1019 m/s
                               # This is an experimental measurement, not a
                               # correlation output.
                               #
                               # CORRELATION CONTEXT (Olazar et al. 1992,
                               # conical spouted beds, Eq. 2):
                               #   U_ms = 0.126 * Ar^0.39 * (D_i/D_c)^1.68
                               #                          * tan(γ/2)^0.38
                               #        = 0.126 * (25433)^0.39 * (0.08)^1.68
                               #               * tan(30°)^0.38
                               #        = 0.126 * 52.25 * 0.0144 * 0.8116
                               #        = 0.0767 m/s
                               # (24% below S2; within Olazar ±30% accuracy.)
                               # Olazar is the correct correlation CLASS for
                               # this geometry; it confirms U > U_ms (spouting
                               # regime) even at its conservative estimate.
                               # Reference: Olazar et al. (1992), Ind. Eng.
                               # Chem. Res. 31(7):1784–1791,
                               # DOI 10.1021/ie00007a024.
                               #
                               # MATHUR-GISHLER NOTE: Mathur-Gishler (1955)
                               # cylindrical correlation gives U_ms = 0.245 m/s
                               # at H=32 mm (U/U_ms = 0.78, below threshold).
                               # M-G systematically over-predicts U_ms for
                               # conical beds at low H/D_c — do NOT use M-G
                               # for this geometry. See notes/benchmarks.md §4
                               # audit item 3 (now resolved).
                               # source: S2 (primary); Olazar 1992 (supporting).

  U_over_U_ms: 1.88            # U_sup / U_ms = 0.1920 / 0.1019 = 1.883
                               # ≈ 1.9 (rounded in PLAN.md and run_log.csv).
                               # S2 reports stable coherent spouting over
                               # U/U_ms = 1.0–1.9 for 500 µm ZrO₂; 1.88
                               # places Case V at the upper edge of S2's
                               # stable-spouting range (not the "pulsatory"
                               # regime described in Marshall17, which operates
                               # below U_ms with a different geometry).
                               # source: derived from U_sup_m_s / U_ms_m_s;
                               #         S2 for the stable-spouting bound.
